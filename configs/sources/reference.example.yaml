# Reference-population adapter (MIMIC-IV v3.1, hosp and icu modules; PhysioNet credentialed access).
# Copy to configs/local/reference.yaml and set ``root`` to the local copy of the dataset.
root: /absolute/path/to/mimic-iv-3.1
tables:
  admissions: {path: hosp/admissions.csv.gz, columns: {subject_key: subject_id, hadm_key: hadm_id, admit_time: admittime, discharge_time: dischtime}}
  patients: {path: hosp/patients.csv.gz, columns: {subject_key: subject_id, anchor_age: anchor_age, anchor_year: anchor_year}}
  icu_stays: {path: icu/icustays.csv.gz, columns: {subject_key: subject_id, hadm_key: hadm_id, icu_key: stay_id, in_time: intime, out_time: outtime}}
  diagnoses: {path: hosp/diagnoses_icd.csv.gz, columns: {hadm_key: hadm_id, code: icd_code, version: icd_version}}
  procedures: {path: hosp/procedures_icd.csv.gz, columns: {hadm_key: hadm_id, code: icd_code, version: icd_version}}
  labs: {path: hosp/labevents.csv.gz, columns: {subject_key: subject_id, hadm_key: hadm_id, item: itemid, time: charttime, value: valuenum}}
  med_admin: {path: hosp/emar.csv.gz, columns: {subject_key: subject_id, hadm_key: hadm_id, admin_key: emar_id, time: charttime, medication: medication, event: event_txt}}
  med_detail: {path: hosp/emar_detail.csv.gz, columns: {admin_key: emar_id, dose: dose_given, unit: dose_given_unit}}
  infusions: {path: icu/inputevents.csv.gz, columns: {icu_key: stay_id, start: starttime, end: endtime, item: itemid, amount: amount, unit: amountuom}}
  outputs: {path: icu/outputevents.csv.gz, columns: {icu_key: stay_id, time: charttime, item: itemid, value: value}}
lab_items: {LAB_NA: [50983, 52623], LAB_K: [50971, 52610], LAB_CL: [50902, 52535], LAB_GLU: [50931, 52569],
            LAB_UREA: [51006, 52647], LAB_CREA: [50912, 52546], LAB_ALB: [50862, 53085]}
unit_to_development: {GLU: 0.0555, UREA: 0.357, CREA: 88.4, ALB: 10.0, URINE: 24.0}
administered_events: [Administered]
